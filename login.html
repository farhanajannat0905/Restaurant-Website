<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Nokshi Restaurant</title>


    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <!-- Login CSS -->
    <link rel="stylesheet" href="login.css">

</head>


<body>


    <!-- Login Page -->
    <main class="login-page">


        <!-- Left Side: Restaurant Branding -->
        <section class="login-banner">


            <!-- Dark overlay -->
            <div class="banner-overlay"></div>


            <!-- Banner content -->
            <div class="banner-content">


                <!-- Nokshi Logo -->
                <a href="index.html" class="banner-logo">

                    <span class="logo-symbol">
                        ✧
                    </span>

                    <span class="logo-text">
                        NOKSHI
                    </span>

                </a>


                <p class="banner-subtitle">
                    TRADITION SERVED WITH LOVE
                </p>


                <h1>
                    Welcome Back
                </h1>


                <p class="banner-description">
                    Sign in to continue your journey through
                    the authentic flavors of Bangladesh.
                </p>


                <a href="index.html" class="back-home">

                    ← Back to Home

                </a>


            </div>


        </section>


        <!-- Right Side: Login Form -->
        <section class="login-form-area">


            <div class="login-box">


                <p class="form-small-title">
                    WELCOME TO NOKSHI
                </p>


                <h2>
                    Sign In
                </h2>


                <p class="form-description">
                    Enter your details to access your account.
                </p>


                <!-- Login Form -->
                <form id="loginForm">


                    <!-- Email -->
                    <div class="input-group">

                        <label for="email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                            required
                        >

                    </div>


                    <!-- Password -->
                    <div class="input-group">

                        <label for="password">
                            Password
                        </label>


                        <div class="password-box">

                            <input
                                type="password"
                                id="password"
                                placeholder="Enter your password"
                                required
                            >


                            <button
                                type="button"
                                id="togglePassword"
                                class="toggle-password"
                                aria-label="Show password"
                            >
                                Show
                            </button>

                        </div>

                    </div>


                    <!-- Remember and Forgot -->
                    <div class="form-options">


                        <label class="remember-me">

                            <input
                                type="checkbox"
                                id="remember"
                            >

                            <span>
                                Remember me
                            </span>

                        </label>


                        <a href="#" class="forgot-password">
                            Forgot password?
                        </a>


                    </div>


                    <!-- Login Button -->
                    <button
                        type="submit"
                        class="login-button"
                    >
                        Sign In
                    </button>


                    <!-- JavaScript message -->
                    <p
                        id="message"
                        class="message"
                    ></p>


                </form>


                <!-- Sign Up -->
                <p class="signup-text">

                    Don't have an account?

                    <a href="#">
                        Create an account
                    </a>

                </p>


            </div>


        </section>


    </main>


    <!-- Login JavaScript -->
    <script src="login.js"></script>


</body>

</html>
